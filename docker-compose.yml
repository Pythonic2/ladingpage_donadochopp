services:
  ladingpage2-chopp:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    ports:
      - "8010:8010"
    networks:
      - pi_default
    volumes:
      - ladingpage2_chopp_data:/var/lib/postgresql/data
      - ladingpage2_chopp_app:/app/media
volumes:
  ladingpage2_chopp_data:
  ladingpage2_chopp_app:
networks:
  pi_default:
    external: true