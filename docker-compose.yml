services:
  ladingpage2-chopp:
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: always
    env_file:
      - .env
    ports:
      - "8010:8080"
    networks:
      - pi_default
    environment:
      DJANGO_ENV: production
      PORT: "8080"
      DB_SCHEMA: ladingpageddc
      SERVE_MEDIA: "true"
      RUN_MIGRATIONS: "true"
    volumes:
      - ladingpage2_chopp_app:/app/media
volumes:
  ladingpage2_chopp_app:
    name: ladingpage2_chopp_app
networks:
  pi_default:
    external: true
