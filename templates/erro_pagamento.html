<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro no pagamento</title>
    <style>
        body {
            margin: 0;
            background: #fff8ec;
            color: #20130f;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            width: min(100%, 720px);
            border: 1px solid rgba(32, 19, 15, .12);
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 45px rgba(32, 19, 15, .12);
            padding: 32px;
        }

        h1 {
            margin: 0 0 12px;
            color: #df2f24;
            font-size: 30px;
        }

        p {
            margin: 0 0 18px;
            color: rgba(32, 19, 15, .72);
            line-height: 1.6;
        }

        pre {
            max-height: 280px;
            overflow: auto;
            border-radius: 12px;
            background: #20130f;
            color: #fff8ec;
            padding: 16px;
            white-space: pre-wrap;
        }

        a {
            display: inline-flex;
            margin-top: 8px;
            border-radius: 999px;
            background: #df2f24;
            color: #fff;
            padding: 12px 20px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Não foi possível abrir o checkout</h1>
            <p>{{ mensagem }}</p>

            {% if detalhe %}
            <p>Resposta recebida do Mercado Pago:</p>
            <pre>{{ detalhe }}</pre>
            {% endif %}

            <a href="{% url 'home' %}">Voltar para a página inicial</a>
        </section>
    </main>
</body>

</html>
